<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EKS NEXUS Platform</title>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #050505;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-gray-100 flex justify-center items-center min-h-screen">

  <div id="root" class="w-full max-w-md min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('home'); // 'home', 'explore', 'create', 'community', 'profile'
      const [activeHub, setActiveHub] = useState(null); // 'learn', 'play', 'work', 'rewards'

      // User Gamification & Financial State
      const [userState, setUserState] = useState({
        name: "Aung Kyaw",
        membership: "PRO MEMBER", // Free, Pro, VIP
        level: 5,
        xp: 1250,
        maxXp: 2000,
        tokens: 450,
        walletBalance: 25000, // MMK
        streak: 4,
        hasCheckedInToday: false
      });

      // Daily Skill Test / Quiz Arena State
      const [inQuiz, setInQuiz] = useState(false);
      const [quizScore, setQuizScore] = useState(0);
      const [quizQuestionIndex, setQuizQuestionIndex] = useState(0);
      const [quizTimeLeft, setQuizTimeLeft] = useState(15);
      const [quizFinished, setQuizFinished] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);

      // Quiz Questions Database (Skill Tests)
      const [questions] = useState([
        {
          q: "3 Phase 400V Motor အတွက် Power Factor 0.85 ဖြင့် 15kW Motor ၏ Full Load Current ကို တွက်ချက်ပါ?",
          options: ["18.2 A", "25.5 A", "32.0 A", "40.1 A"],
          answer: 1,
          explanation: "I = P / (√3 × V × PF) = 15000 / (1.732 × 400 × 0.85) ≈ 25.5A"
        },
        {
          q: "Single Phase 230V, 30A Continuous Load အတွက် Safety Factor Standard မည်မျှ သတ်မှတ်ရမည်နည်း?",
          options: ["100%", "115%", "125%", "150%"],
          answer: 2,
          explanation: "NEC Standards အမိန့်အရ Continuous Load အတွက် 125% Breaker Rating ယူရမည်။"
        },
        {
          q: "50m အကွာအဝေးရှိ Copper Cable (Resistance 0.0012 Ω/m) မှ 30A စီးဆင်းပါက Voltage Drop မည်မျှရှိမည်နည်း?",
          options: ["1.8 V", "3.6 V", "5.4 V", "7.2 V"],
          answer: 1,
          explanation: "V_drop = 2 × I × L × R = 2 × 30 × 50 × 0.0012 = 3.6V"
        }
      ]);

      // Daily Check-in & Knowledge Reward
      const handleDailyCheckIn = () => {
        if (userState.hasCheckedInToday) return;
        setUserState(prev => ({
          ...prev,
          xp: prev.xp + 100,
          tokens: prev.tokens + 50,
          walletBalance: prev.walletBalance + 1000, // Daily 1,000 MMK Reward
          streak: prev.streak + 1,
          hasCheckedInToday: true
        }));
      };

      // Timer Effect for Skill Quiz Arena
      useEffect(() => {
        let timer;
        if (inQuiz && !quizFinished && quizTimeLeft > 0) {
          timer = setInterval(() => {
            setQuizTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (quizTimeLeft === 0 && inQuiz && !quizFinished) {
          handleNextQuestion();
        }
        return () => clearInterval(timer);
      }, [inQuiz, quizTimeLeft, quizFinished]);

      const startQuiz = () => {
        setInQuiz(true);
        setQuizQuestionIndex(0);
        setQuizScore(0);
        setQuizTimeLeft(15);
        setQuizFinished(false);
        setSelectedOption(null);
      };

      const handleNextQuestion = () => {
        let newScore = quizScore;
        if (selectedOption === questions[quizQuestionIndex].answer) {
          newScore += 100;
          setQuizScore(newScore);
        }

        if (quizQuestionIndex + 1 < questions.length) {
          setQuizQuestionIndex(prev => prev + 1);
          setQuizTimeLeft(15);
          setSelectedOption(null);
        } else {
          setQuizFinished(true);
          const rewardCash = newScore >= 200 ? 10000 : 3000;
          setUserState(prev => ({
            ...prev,
            walletBalance: prev.walletBalance + rewardCash,
            xp: Math.min(prev.maxXp, prev.xp + newScore)
          }));
        }
      };

      return (
        <div className="w-full bg-neutral-950 min-h-screen flex flex-col justify-between relative shadow-2xl border-x border-neutral-900 pb-20">
          
          <!-- TOP APP BAR -->
          <header className="p-4 flex items-center justify-between border-b border-neutral-900 bg-neutral-950/90 sticky top-0 z-30 backdrop-blur-md">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center">
                <span className="text-emerald-400 font-bold text-lg">⚡</span>
              </div>
              <h1 className="font-extrabold tracking-wider text-base text-white font-mono">
                EKS <span className="text-emerald-400">NEXUS</span>
              </h1>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold font-mono px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-500/30">
                {userState.membership}
              </span>
              <div className="w-8 h-8 rounded-full border border-emerald-500/50 p-0.5 overflow-hidden">
                <img 
                  src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=120" 
                  alt="Profile" 
                  className="w-full h-full object-cover rounded-full"
                />
              </div>
            </div>
          </header>

          <!-- MAIN CONTENT AREA -->
          <main className="flex-1 overflow-y-auto px-4 py-4 space-y-5 custom-scrollbar">

            <!-- DASHBOARD HOME VIEW -->
            {activeTab === 'home' && !activeHub && (
              <>
                <!-- HERO CARD -->
                <div className="bg-gradient-to-br from-neutral-900 via-neutral-950 to-neutral-900 border border-neutral-800 rounded-2xl p-4 relative overflow-hidden shadow-xl">
                  <div className="flex justify-between items-start mb-1">
                    <span className="text-[10px] font-mono tracking-widest text-neutral-400 uppercase">DAILY DASHBOARD</span>
                    <div className="flex items-center gap-1.5 bg-emerald-950/40 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">
                      <span className="text-xs">🔥</span>
                      <span className="text-xs font-semibold text-emerald-400">{userState.streak} Day Streak</span>
                    </div>
                  </div>

                  <h2 className="text-xl font-bold text-white mb-2">
                    Your Next Opportunity Awaits.
                  </h2>

                  <!-- Level Progress -->
                  <div className="flex justify-between items-center text-xs font-mono mb-1">
                    <span className="text-emerald-400 font-bold tracking-wider">NEXUS LEVEL 0{userState.level}</span>
                    <span className="text-emerald-400 font-semibold">{userState.xp} / {userState.maxXp} XP</span>
                  </div>
                  <div className="w-full h-2 bg-neutral-800 rounded-full overflow-hidden p-0.5 border border-neutral-700/50 mb-4">
                    <div 
                      className="h-full bg-emerald-500 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.8)] transition-all duration-500"
                      style={{ width: `${(userState.xp / userState.maxXp) * 100}%` }}
                    />
                  </div>

                  <!-- Wallet Balance & Daily Check-in -->
                  <div className="pt-3 border-t border-neutral-800 flex items-center justify-between">
                    <div>
                      <p className="text-[10px] text-neutral-400 uppercase font-mono">Available Wallet</p>
                      <p className="text-base font-bold text-white font-mono">
                        {userState.walletBalance.toLocaleString()} <span className="text-xs text-emerald-400">MMK</span>
                      </p>
                    </div>
                    <button 
                      onClick={handleDailyCheckIn}
                      disabled={userState.hasCheckedInToday}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                        userState.hasCheckedInToday 
                          ? 'bg-neutral-800 text-neutral-500 border border-neutral-700 cursor-not-allowed' 
                          : 'bg-emerald-500 hover:bg-emerald-400 text-black shadow-lg shadow-emerald-500/20 active:scale-95'
                      }`}
                    >
                      {userState.hasCheckedInToday ? 'Checked In ✓' : 'Daily Knowledge Claim (+1,000 MMK)'}
                    </button>
                  </div>
                </div>

                <!-- 4 CORE FUNCTIONAL HUBS -->
                <div className="grid grid-cols-2 gap-3">
                  <!-- LEARN HUB -->
                  <button 
                    onClick={() => setActiveHub('learn')}
                    className="bg-neutral-900 hover:bg-neutral-800/80 border border-neutral-800 hover:border-emerald-500/50 p-4 rounded-2xl text-left transition flex flex-col justify-between h-32"
                  >
                    <div className="w-9 h-9 rounded-xl bg-neutral-800 flex items-center justify-center border border-neutral-700/50">
                      🎓
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-sm">LEARN</h3>
                      <p className="text-[11px] text-neutral-400">Daily Knowledge Hub</p>
                    </div>
                  </button>

                  <!-- PLAY / ARENA HUB -->
                  <button 
                    onClick={() => setActiveHub('play')}
                    className="bg-neutral-900 hover:bg-neutral-800/80 border border-neutral-800 hover:border-emerald-500/50 p-4 rounded-2xl text-left transition flex flex-col justify-between h-32"
                  >
                    <div className="w-9 h-9 rounded-xl bg-neutral-800 flex items-center justify-center border border-neutral-700/50">
                      🎮
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-sm">PLAY</h3>
                      <p className="text-[11px] text-neutral-400">Skill Arena & Contests</p>
                    </div>
                  </button>

                  <!-- WORK HUB -->
                  <button 
                    onClick={() => setActiveHub('work')}
                    className="bg-neutral-900 hover:bg-neutral-800/80 border border-neutral-800 hover:border-emerald-500/50 p-4 rounded-2xl text-left transition flex flex-col justify-between h-32"
                  >
                    <div className="w-9 h-9 rounded-xl bg-neutral-800 flex items-center justify-center border border-neutral-700/50">
                      💼
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-sm">WORK</h3>
                      <p className="text-[11px] text-neutral-400">Paid Gigs & Projects</p>
                    </div>
                  </button>

                  <!-- REWARDS HUB -->
                  <button 
                    onClick={() => setActiveHub('rewards')}
                    className="bg-neutral-900 hover:bg-neutral-800/80 border border-neutral-800 hover:border-emerald-500/50 p-4 rounded-2xl text-left transition flex flex-col justify-between h-32"
                  >
                    <div className="w-9 h-9 rounded-xl bg-neutral-800 flex items-center justify-center border border-neutral-700/50">
                      🎁
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-sm">REWARDS</h3>
                      <p className="text-[11px] text-neutral-400">Benefits & Cashouts</p>
                    </div>
                  </button>
                </div>

                <!-- TODAY'S WINNERS LEADERBOARD -->
                <div className="bg-neutral-900/50 border border-neutral-800 rounded-2xl p-4">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-bold text-neutral-300 uppercase tracking-wider font-mono">🏆 Daily Cash Winners</span>
                    <span className="text-[10px] text-emerald-400 font-mono">Live Updated</span>
                  </div>
                  <div className="space-y-2 text-xs font-mono">
                    <div className="flex items-center justify-between bg-neutral-950 p-2.5 rounded-xl border border-neutral-800/80">
                      <span className="text-white">1. Ko Min Han (Yangon)</span>
                      <span className="text-emerald-400 font-bold">+50,000 MMK (KPay)</span>
                    </div>
                    <div className="flex items-center justify-between bg-neutral-950 p-2.5 rounded-xl border border-neutral-800/80">
                      <span className="text-white">2. Thura Swe (Mandalay)</span>
                      <span className="text-emerald-400 font-bold">+20,000 MMK (KPay)</span>
                    </div>
                  </div>
                </div>
              </>
            )}

            <!-- SKILL ARENA (PLAY HUB) -->
            {activeHub === 'play' && (
              <div className="space-y-4">
                <button 
                  onClick={() => { setActiveHub(null); setInQuiz(false); }}
                  className="text-xs text-emerald-400 font-mono"
                >
                  ← Back to Dashboard
                </button>

                <div className="bg-neutral-900 border border-emerald-500/30 rounded-2xl p-4">
                  <span className="text-xs font-bold font-mono text-emerald-400">SKILL CONTEST ARENA</span>
                  <h2 className="text-lg font-bold text-white mt-1">Daily Engineering Speed Run</h2>
                  <p className="text-xs text-neutral-400 mt-1">
                    100% Transparent calculation contest. Correct answers instantly win real cash payouts directly to KPay.
                  </p>
                </div>

                {!inQuiz ? (
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-4">
                    <div className="flex justify-between items-center text-xs border-b border-neutral-800 pb-3 font-mono">
                      <span className="text-neutral-400">Today's Grand Pool:</span>
                      <span className="text-base font-bold text-emerald-400">100,000 MMK</span>
                    </div>
                    <div className="space-y-2 text-xs text-neutral-300">
                      <p>✓ 3 Real-world Engineering Calculation Questions</p>
                      <p>⏱ 15 Seconds Time limit per question</p>
                      <p>💸 Automatic Direct KPay Payout for winners</p>
                    </div>
                    <button 
                      onClick={startQuiz}
                      className="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl transition font-mono active:scale-95"
                    >
                      START DAILY CONTEST NOW
                    </button>
                  </div>
                ) : !quizFinished ? (
                  <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-4">
                    <div className="flex justify-between items-center text-xs font-mono text-neutral-400 border-b border-neutral-800 pb-2">
                      <span>Question {quizQuestionIndex + 1} of {questions.length}</span>
                      <span className="text-emerald-400 font-bold">⏱ {quizTimeLeft}s</span>
                    </div>
                    <h3 className="text-sm font-semibold text-white">
                      {questions[quizQuestionIndex].q}
                    </h3>
                    <div className="space-y-2">
                      {questions[quizQuestionIndex].options.map((opt, idx) => (
                        <button
                          key={idx}
                          onClick={() => setSelectedOption(idx)}
                          className={`w-full text-left p-3 rounded-xl border text-xs font-mono transition ${
                            selectedOption === idx 
                              ? 'bg-emerald-500/20 border-emerald-500 text-white' 
                              : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={handleNextQuestion}
                      disabled={selectedOption === null}
                      className={`w-full py-2.5 rounded-xl font-bold text-xs transition ${
                        selectedOption !== null 
                          ? 'bg-emerald-500 text-black hover:bg-emerald-400' 
                          : 'bg-neutral-800 text-neutral-500 cursor-not-allowed'
                      }`}
                    >
                      Submit Answer →
                    </button>
                  </div>
                ) : (
                  <div className="bg-neutral-900 border border-emerald-500/40 rounded-2xl p-5 text-center space-y-4">
                    <h3 className="text-lg font-bold text-white">Contest Completed! 🎉</h3>
                    <div className="bg-neutral-950 p-4 rounded-xl border border-neutral-800 space-y-1">
                      <p className="text-xs text-neutral-400">Total Arena Score</p>
                      <p className="text-2xl font-extrabold text-emerald-400 font-mono">{quizScore} PTS</p>
                      <p className="text-xs text-emerald-400 font-mono mt-2">
                        +{quizScore >= 200 ? '10,000 MMK' : '3,000 MMK'} Added to your Wallet!
                      </p>
                    </div>
                    <button 
                      onClick={() => setInQuiz(false)}
                      className="w-full bg-neutral-800 hover:bg-neutral-700 text-white font-bold py-2.5 rounded-xl text-xs transition"
                    >
                      Return to Arena Lobby
                    </button>
                  </div>
                )}
              </div>
            )}

            <!-- LEARN HUB VIEW -->
            {activeHub === 'learn' && (
              <div className="space-y-4">
                <button onClick={() => setActiveHub(null)} className="text-xs text-emerald-400 font-mono">← Back to Dashboard</button>
                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-white">Daily Knowledge Articles & Tools</h2>
                  <p className="text-xs text-neutral-400 mt-1">Electrical, MEP & Solar Engineering handbooks updated daily.</p>
                </div>
                <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-2">
                  <span className="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">TODAY'S ARTICLE</span>
                  <h3 className="font-bold text-sm text-white">33kV Transformer Protection & Relay Sizing Guide</h3>
                  <p className="text-xs text-neutral-400">Complete calculation guidelines compliant with IEC standards...</p>
                </div>
              </div>
            )}

            <!-- WORK HUB VIEW -->
            {activeHub === 'work' && (
              <div className="space-y-4">
                <button onClick={() => setActiveHub(null)} className="text-xs text-emerald-400 font-mono">← Back to Dashboard</button>
                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-white">Verified Freelance Gigs</h2>
                  <p className="text-xs text-neutral-400 mt-1">Get paid by completing engineering tasks and designs.</p>
                </div>
                <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-2">
                  <div className="flex justify-between items-start">
                    <h3 className="font-bold text-sm text-white">500kW Commercial Solar SLD Design</h3>
                    <span className="text-xs font-bold text-emerald-400 font-mono">150,000 MMK</span>
                  </div>
                  <p className="text-xs text-neutral-400">Requirement: Level 4+ NEXUS Rank & AutoCAD expertise.</p>
                  <button className="w-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold py-1.5 rounded-xl text-xs">Apply Project</button>
                </div>
              </div>
            )}

            <!-- REWARDS HUB VIEW -->
            {activeHub === 'rewards' && (
              <div className="space-y-4">
                <button onClick={() => setActiveHub(null)} className="text-xs text-emerald-400 font-mono">← Back to Dashboard</button>
                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4">
                  <h2 className="text-base font-bold text-white">KPay Cashout & Benefits</h2>
                  <p className="text-xs text-neutral-400 mt-1">Directly withdraw your earnings to your KBZPay account.</p>
                </div>
                <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl flex justify-between items-center">
                  <div>
                    <p className="text-xs font-bold text-white">Instant KPay Withdrawal</p>
                    <p className="text-[10px] text-neutral-400 font-mono">Minimum: 10,000 MMK</p>
                  </div>
                  <button className="bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-bold px-4 py-2 rounded-xl font-mono">
                    Withdraw
                  </button>
                </div>
              </div>
            )}

          </main>

          <!-- BOTTOM NAVIGATION BAR -->
          <nav className="fixed bottom-0 max-w-md w-full bg-neutral-950/95 border-t border-neutral-900 px-4 py-3 flex justify-around items-center z-40 backdrop-blur-lg">
            <button 
              onClick={() => { setActiveTab('home'); setActiveHub(null); }}
              className={`flex flex-col items-center text-xs font-mono ${activeTab === 'home' && !activeHub ? 'text-emerald-400' : 'text-neutral-500'}`}
            >
              <span>🏠</span>
              <span className="text-[10px] mt-0.5">Home</span>
            </button>
            <button 
              onClick={() => { setActiveTab('explore'); setActiveHub(null); }}
              className={`flex flex-col items-center text-xs font-mono ${activeTab === 'explore' ? 'text-emerald-400' : 'text-neutral-500'}`}
            >
              <span>🧩</span>
              <span className="text-[10px] mt-0.5">Explore</span>
            </button>
            <button 
              onClick={() => { setActiveTab('community'); setActiveHub(null); }}
              className="flex flex-col items-center justify-center -mt-4"
            >
              <div className="w-11 h-11 rounded-full bg-emerald-500 text-black flex items-center justify-center shadow-lg shadow-emerald-500/40 border-2 border-black">
                <span className="text-lg">➕</span>
              </div>
            </button>
            <button 
              onClick={() => { setActiveTab('community'); setActiveHub(null); }}
              className={`flex flex-col items-center text-xs font-mono ${activeTab === 'community' ? 'text-emerald-400' : 'text-neutral-500'}`}
            >
              <span>💬</span>
              <span className="text-[10px] mt-0.5">Community</span>
            </button>
            <button 
              onClick={() => { setActiveTab('profile'); setActiveHub(null); }}
              className={`flex flex-col items-center text-xs font-mono ${activeTab === 'profile' ? 'text-emerald-400' : 'text-neutral-500'}`}
            >
              <span>👤</span>
              <span className="text-[10px] mt-0.5">Profile</span>
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
